[package]
name = "pi-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ZeePal"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
allocative = "=0.3.4" # BUG: pinned due to update (v0.3.6?) causing bug with starlark_map v0.13.0
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

codex-sandboxing = { git = "https://github.com/openai/codex.git", tag = "rust-v0.133.0", package = "codex-sandboxing" }
codex-linux-sandbox = { git = "https://github.com/openai/codex.git", tag = "rust-v0.133.0", package = "codex-linux-sandbox" }
codex-network-proxy = { git = "https://github.com/openai/codex.git", tag = "rust-v0.133.0", package = "codex-network-proxy" }
codex-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.133.0", package = "codex-protocol" }
